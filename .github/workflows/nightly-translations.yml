name: Refresh Chinese translations

concurrency:
  group: refresh-chinese-translations-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # GitHub cron is UTC. Run daily at 10:30 PM Pacific:
    # 05:30 UTC = 10:30 PM PDT; 06:30 UTC = 10:30 PM PST.
    # Both schedules fire year-round; the first step gates execution to
    # the occurrence whose America/Los_Angeles local hour is 22.
    - cron: '30 5 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Gate scheduled run to 10:30 PM Pacific
        if: ${{ github.event_name == 'schedule' }}
        run: |
          hour=$(TZ=America/Los_Angeles date +%H)
          if [ "$hour" != "22" ]; then
            echo "Scheduled duplicate is not 10:30 PM Pacific; stopping successfully."
            echo "SKIP_TRANSLATION=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: ${{ env.SKIP_TRANSLATION != 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ env.SKIP_TRANSLATION != 'true' }}
        with:
          node-version: 22
      - name: Verify translation pipeline contracts
        if: ${{ env.SKIP_TRANSLATION != 'true' }}
        run: |
          node --check scripts/generate-chinese-translations.mjs
          node scripts/event-translations.test.mjs
          node scripts/translation-text.test.mjs
          node scripts/translation-overlay.test.mjs
          node scripts/runtime-translation-fallback.test.mjs
      - name: Fill missing or stale Chinese translations
        if: ${{ env.SKIP_TRANSLATION != 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATION_MODEL: gpt-6-luna
        run: node scripts/generate-chinese-translations.mjs
      - name: Build runtime translation overlay
        if: ${{ env.SKIP_TRANSLATION != 'true' }}
        run: node scripts/build-translation-overlay.mjs
      - name: Apply approved Chinese translations
        if: ${{ env.SKIP_TRANSLATION != 'true' }}
        run: node scripts/apply-event-translations.mjs
      - name: Verify translation state
        if: ${{ env.SKIP_TRANSLATION != 'true' }}
        run: |
          node scripts/translation-qa.mjs
          node scripts/runtime-translation-fallback.test.mjs
          node scripts/translation-coverage-report.mjs
      - name: Save refreshed Chinese translations
        if: ${{ env.SKIP_TRANSLATION != 'true' }}
        run: |
          git config user.name "south-bay-events-bot"
          git config user.email "actions@github.com"
          git add 'data/translations.zh*.json' data/translations.zh.js data/events.json data/events.js
          if git diff --staged --quiet; then
            echo "Chinese translations are already current."
            exit 0
          fi
          git commit -m "chore: refresh Chinese translations"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
