name: Patch Chinese static copy

on:
  push:
    branches:
      - feature/multilingual-v1
    paths:
      - '.github/workflows/patch-zh-static-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multilingual-v1
      - name: Patch Chinese homepage copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('zh/index.html')
          s = p.read_text()
          replacements = {
            '<span class="hero-date-label" data-i18n="date">Date</span>': '<span class="hero-date-label" data-i18n="date">日期</span>',
            '<span id="updateText">Reading the latest update…</span>': '<span id="updateText">正在读取最新更新…</span>',
            '<div class="sticker s1">OUTDOOR<br />FINDS</div><div class="sticker s2">WEEKEND<br />JOY</div>': '<div class="sticker s1">户外<br />发现</div><div class="sticker s2">周末<br />乐趣</div>',
            '<p class="eyebrow">FAMILY GUIDES</p>': '<p class="eyebrow">家庭专题</p>',
            '<h2 id="collectionsHeading">Explore Collections</h2>': '<h2 id="collectionsHeading">浏览专题</h2>',
            '<p>Curated guides that make it easier to choose what to do together.</p>': '<p>精选主题活动指南，帮你更轻松决定一家人一起去哪儿。</p>',
            '<span data-i18n="filter">Filter</span>': '<span data-i18n="filter">筛选</span>',
            '<button class="clear-filters" id="clearFilters" type="button" data-i18n="clearFilters">Clear filters</button>': '<button class="clear-filters" id="clearFilters" type="button" data-i18n="clearFilters">清除筛选</button>'
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected source: {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git rm .github/workflows/patch-zh-static-copy.yml
          git add zh/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: localize Chinese homepage collection copy"
          git push origin HEAD:feature/multilingual-v1
