name: Baseline new Chinese translations

on:
  push:
    branches:
      - feature/multilingual-v1
      - main
    paths:
      - 'data/translations.zh*.json'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baseline AUTO fingerprints only
        run: node scripts/baseline-new-translations.mjs
      - name: Commit baselined catalogs
        run: |
          if git diff --quiet -- 'data/translations.zh*.json'; then
            echo "No AUTO fingerprints to baseline."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/translations.zh*.json
          git commit -m "chore: baseline new Chinese translation fingerprints"
          git push origin HEAD:${GITHUB_REF_NAME}
