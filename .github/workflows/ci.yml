name: Verify South Bay Family Finds
# This workflow is intentionally read-only: generated activity data is
# validated separately by the refresh workflow and does not need a second CI run.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/sources.json'
      - 'analytics.js'
      - 'map-navigation.js'
      - 'scripts/map-navigation.test.mjs'
      - 'privacy.html'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/sources.json'
      - 'analytics.js'
      - 'map-navigation.js'
      - 'scripts/map-navigation.test.mjs'
      - 'privacy.html'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check refresh-script syntax
        run: |
          node --check scripts/update-events.mjs
          node --check map-navigation.js
      - name: Run policy and data-contract tests
        run: |
          node scripts/test-event-summary-engine.mjs
          node scripts/test-summary-output.mjs
          node scripts/classification.test.mjs
          node scripts/cost-policy.test.mjs
          node scripts/movie-policy.test.mjs
          node scripts/recommendation.test.mjs
          node scripts/map-navigation.test.mjs
