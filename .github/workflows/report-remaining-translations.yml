name: Report remaining Chinese translations

# one-shot final QA
on:
  push:
    branches:
      - feature/multilingual-v1
    paths:
      - '.github/workflows/report-remaining-translations.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify translation QA and coverage
        run: |
          node scripts/translation-qa.mjs
          node scripts/translation-coverage-report.mjs
