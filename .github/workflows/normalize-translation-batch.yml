name: Normalize translation batch

on:
  push:
    branches:
      - feature/multilingual-v1
    paths:
      - 'scripts/normalize-translation-batch.mjs'
      - '.github/workflows/normalize-translation-batch.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize batch fingerprints
        run: node scripts/normalize-translation-batch.mjs
      - name: Commit normalized catalog
        run: |
          if git diff --quiet -- data/translations.zh.2026-h2-b2.json; then
            echo "No fingerprint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/translations.zh.2026-h2-b2.json
          git commit -m "chore: normalize translation batch fingerprints"
          git push origin HEAD:feature/multilingual-v1
