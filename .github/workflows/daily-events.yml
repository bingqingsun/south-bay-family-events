name: Refresh South Bay events

on:
  schedule:
    # 06:20 Pacific Standard Time; daylight-saving weeks may run one hour later.
    - cron: '20 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-events.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Save refreshed event list
        run: |
          git config user.name "south-bay-events-bot"
          git config user.email "actions@github.com"
          git add data/events.json
          git diff --staged --quiet || git commit -m "chore: refresh South Bay events"
          git push
