name: Refresh South Bay events

on:
  schedule:
    # Weekdays at 06:20 PST / 07:20 PDT. RSS feeds refresh every weekday;
    # SerpApi fallback runs only on Tuesday and Thursday.
    - cron: '20 14 * * 1-5'
  workflow_dispatch:
    inputs:
      include_serpapi:
        description: '同时运行 SerpApi 兜底搜索（约消耗 14 次查询）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-events.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          INCLUDE_SERPAPI: ${{ inputs.include_serpapi }}
      - name: Save refreshed event list
        run: |
          git config user.name "south-bay-events-bot"
          git config user.email "actions@github.com"
          git add data/events.json
          git diff --staged --quiet || git commit -m "chore: refresh South Bay events"
          git push
