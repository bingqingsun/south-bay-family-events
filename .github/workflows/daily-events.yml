name: Refresh South Bay events

concurrency:
  group: refresh-south-bay-events-${{ github.ref }}
  cancel-in-progress: true

on:
  # A source or refresh-script change should immediately rebuild the published
  # list without asking the maintainer to run
  # Actions manually after pushing the configuration.
  push:
    branches-ignore:
      - 'preview-acceptance'
    paths:
      - 'scripts/update-events.mjs'
      - 'scripts/event-summary-engine.mjs'
      - 'scripts/test-event-summary-engine.mjs'
      - 'scripts/test-summary-output.mjs'
      - 'scripts/link-health.mjs'
      - 'scripts/link-health.test.mjs'
      - 'scripts/detail-enrichment.test.mjs'
      - 'scripts/canonical-detail-enrichment.test.mjs'
      - 'scripts/lib/**'
      - 'scripts/cupertino-audience.mjs'
      - 'scripts/cupertino-audience.test.mjs'
      - 'data/sources.json'
      - 'app.js'
      - 'collections.js'
      - '.github/workflows/daily-events.yml'
  schedule:
    # Weekdays at 06:20 PST / 07:20 PDT. RSS feeds refresh every weekday;
    # SerpApi fallback runs only on Tuesday and Thursday.
    - cron: '20 14 * * 1-5'
  workflow_dispatch:
    inputs:
      include_serpapi:
        description: '同时运行 SerpApi 兜底搜索（约消耗 14 次查询）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test event-summary engine contracts
        run: |
          node scripts/test-event-summary-engine.mjs
          node scripts/link-health.test.mjs
          node scripts/detail-enrichment.test.mjs
          node scripts/canonical-detail-enrichment.test.mjs
          node scripts/link-ui.test.cjs
          node scripts/cupertino-audience.test.mjs
          node scripts/age-policy.test.cjs
      - run: node scripts/update-events.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          # A configuration push refreshes the free direct sources only. A
          # scheduled run passes `auto`, allowing the script to use SerpApi
          # only on Tuesday and Thursday; a manual run uses the checkbox above.
          # GitHub exposes the manual input's default (`false`) on scheduled
          # runs too, so relying on `inputs.include_serpapi` here would
          # silently disable the scheduled fallback.
          INCLUDE_SERPAPI: ${{ github.event_name == 'schedule' && 'auto' || github.event_name == 'push' && 'false' || inputs.include_serpapi }}
      - name: Audit published summary provenance
        run: node scripts/test-summary-output.mjs
      - name: Save refreshed event list
        run: |
          git config user.name "south-bay-events-bot"
          git config user.email "actions@github.com"
          git add data/events.json data/events.js data/museums.json data/museums.js data/source-health.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh South Bay events"
          # A maintainer may update docs/code while this refresh is running.
          # Rebase the generated-data commit onto the latest branch head instead
          # of failing a non-fast-forward push and losing an otherwise valid refresh.
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
