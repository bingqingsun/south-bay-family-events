name: Refresh South Bay events

concurrency:
  group: refresh-south-bay-events-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/update-events.mjs'
      - 'scripts/event-summary-engine.mjs'
      - 'scripts/test-event-summary-engine.mjs'
      - 'scripts/test-summary-output.mjs'
      - 'scripts/summary-quality-repair.mjs'
      - 'scripts/summary-semantic-coverage.test.mjs'
      - 'scripts/link-health.mjs'
      - 'scripts/link-health.test.mjs'
      - 'scripts/canonical-detail-pipeline.mjs'
      - 'scripts/canonical-detail-pipeline.test.mjs'
      - 'scripts/lib/**'
      - 'scripts/detail-enrichment.test.mjs'
      - 'scripts/cupertino-audience.mjs'
      - 'scripts/cupertino-audience.test.mjs'
      - 'scripts/apply-event-supplements.mjs'
      - 'data/sources.json'
      - 'data/event-supplements.json'
      - 'app.js'
      - 'collections.js'
      - '.github/workflows/daily-events.yml'
  schedule:
    # GitHub cron is UTC. Run daily at 10 PM Pacific:
    # 05:00 UTC = 10 PM PDT; 06:00 UTC = 10 PM PST.
    # Both schedules fire year-round; the first step gates execution to
    # the occurrence whose America/Los_Angeles local hour is 22.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      include_serpapi:
        description: '同时运行 SerpApi 兜底搜索（约消耗 14 次查询）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gate scheduled run to 10 PM Pacific
        if: ${{ github.event_name == 'schedule' }}
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          utc_date=$(date -u +%F)
          case "$SCHEDULE" in
            "0 5 * * *") nominal_utc="$utc_date 05:00 UTC" ;;
            "0 6 * * *") nominal_utc="$utc_date 06:00 UTC" ;;
            *)
              echo "Unexpected schedule: $SCHEDULE"
              exit 1
              ;;
          esac
          local_time=$(TZ=America/Los_Angeles date -d "$nominal_utc" +%H:%M)
          if [ "$local_time" != "22:00" ]; then
            echo "Scheduled duplicate maps to $local_time Pacific instead of 22:00; stopping successfully."
            echo "SKIP_REFRESH=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: ${{ env.SKIP_REFRESH != 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ env.SKIP_REFRESH != 'true' }}
        with:
          node-version: 22
      - name: Test event data contracts
        if: ${{ env.SKIP_REFRESH != 'true' }}
        run: |
          node scripts/test-event-summary-engine.mjs
          node scripts/link-health.test.mjs
          node scripts/event-lifecycle.test.mjs
          node scripts/detail-enrichment.test.mjs
          node scripts/canonical-detail-pipeline.test.mjs
          node scripts/special-event-pages.test.mjs
          node scripts/linked-official-detail.test.mjs
          node scripts/link-ui.test.cjs
          node scripts/cupertino-audience.test.mjs
          node scripts/age-policy.test.cjs
      - name: Refresh canonical event data
        if: ${{ env.SKIP_REFRESH != 'true' }}
        run: node scripts/update-events.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          INCLUDE_SERPAPI: ${{ github.event_name == 'schedule' && 'auto' || github.event_name == 'push' && 'false' || inputs.include_serpapi }}
      - name: Apply manually verified canonical supplements
        if: ${{ env.SKIP_REFRESH != 'true' }}
        run: node scripts/apply-event-supplements.mjs
      - name: Repair grounded summary quality issues
        if: ${{ env.SKIP_REFRESH != 'true' }}
        run: node scripts/summary-quality-repair.mjs
      - name: Audit published summary provenance
        if: ${{ env.SKIP_REFRESH != 'true' }}
        env:
          REQUIRE_CURRENT_SUMMARY_VERSION: '1'
        run: node scripts/test-summary-output.mjs
      - name: Audit summary semantic coverage
        if: ${{ env.SKIP_REFRESH != 'true' }}
        run: node scripts/summary-semantic-coverage.test.mjs
      - name: Save refreshed event list
        if: ${{ env.SKIP_REFRESH != 'true' }}
        run: |
          git config user.name "south-bay-events-bot"
          git config user.email "actions@github.com"
          git add data/events.json data/events.js data/museums.json data/museums.js data/source-health.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh South Bay events"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
